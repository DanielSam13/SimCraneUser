<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SimCrane User - Gerenciamento</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SC User">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  
  <!-- Manifest -->
  <link rel="manifest" href="manifest.webmanifest">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- 1. LOGIN CONTAINER -->
  <main id="auth-container" class="fade-in">
    <div class="glass-card">
      <div class="logo-header">
        <img class="logo-img" src="icons/icon.svg" alt="SimCrane Logo">
        <h1>SimCrane User</h1>
        <p>Aprovação e controle de contas</p>
      </div>
      
      <form id="login-form" style="margin-top: 32px;">
        <div class="form-group">
          <label for="login-email">E-mail do Administrador</label>
          <div class="input-wrapper">
            <input type="email" id="login-email" required placeholder="admin@simcrane.com" autocomplete="email">
          </div>
        </div>
        
        <div class="form-group" style="margin-bottom: 24px;">
          <label for="login-password">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>

        <div id="auth-error" class="error-box" style="margin-bottom: 20px;"></div>
        
        <button type="submit" id="btn-login" class="btn btn-primary">
          <span class="btn-text">Entrar</span>
        </button>
      </form>
    </div>
  </main>

  <!-- 2. DASHBOARD CONTAINER -->
  <main id="dashboard-container" class="fade-in">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-left">
        <img class="header-logo" src="icons/icon.svg" alt="SimCrane Logo">
        <div class="header-titles">
          <h2>Gerenciar Usuários</h2>
          <p>Aprovação e bloqueio de contas</p>
        </div>
      </div>
      <div class="header-right">
        <span class="admin-badge" id="admin-email-display">admin@simcrane.com</span>
        <button id="btn-logout" class="logout-btn">Sair</button>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="toolbar">
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar por nome ou ID...">
      </div>
    </section>

    <!-- Alerts Container -->
    <div id="alerts-container" class="fade-in" style="display: none; flex-direction: column; gap: 8px; margin-bottom: 16px;"></div>

    <!-- Main Table/List Panel -->
    <section class="panel-container">
      <div class="table-wrapper">
        <table id="profiles-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Status</th>
              <th>Validade</th>
              <th style="text-align: right;">Ação</th>
            </tr>
          </thead>
          <tbody id="profiles-list">
            <!-- Loaded dynamically via JavaScript -->
          </tbody>
        </table>
      </div>
      
      <!-- Loading Indicator -->
      <div id="dashboard-loading" class="dashboard-loading">
        <div class="spinner"></div>
        <p>Carregando usuários...</p>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" style="display: none;">
        Nenhum usuário encontrado.
      </div>
    </section>
  </main>

  <!-- EDIT USER MODAL -->
  <div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="glass-card modal-content">
      <div class="modal-header">
        <h2>Editar Usuário</h2>
        <button id="btn-close-modal" class="modal-close-btn">&times;</button>
      </div>
      <form id="edit-user-form">
        <input type="hidden" id="edit-user-id">
        
        <div class="form-group">
          <label for="edit-user-name">Nome Completo</label>
          <div class="input-wrapper">
            <input type="text" id="edit-user-name" required placeholder="Nome do usuário">
          </div>
        </div>

        <div class="form-group">
          <label for="edit-user-company">Empresa</label>
          <div class="input-wrapper">
            <input type="text" id="edit-user-company" placeholder="Ex: SimCrane Ltda">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="edit-user-group">Grupo / Equipe</label>
          <div class="input-wrapper">
            <input type="text" id="edit-user-group" placeholder="Ex: Operadores, Engenharia">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancel-edit" class="btn btn-danger-outline">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Area -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Main JavaScript App -->
  <script type="module" src="app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado com sucesso: ', reg.scope))
          .catch((err) => console.error('Falha ao registrar o Service Worker: ', err));
      });
    }
  </script>
</body>
</html>
