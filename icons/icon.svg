<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="100" fill="#111827"/>
  
  <!-- Subtle Poly Background -->
  <path d="M0 0 L512 512 M512 0 L0 512 M256 0 L256 512 M0 256 L512 256" stroke="#1f2937" stroke-width="2"/>

  <!-- Main Crane Structure (Amber Neon) -->
  <g stroke="#f59e0b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-amber)">
    <!-- Chassis -->
    <path d="M100 280 L420 280 L420 330 L100 330 Z" />
    
    <!-- Wheels (4 axles) -->
    <circle cx="140" cy="360" r="22" />
    <circle cx="200" cy="360" r="22" />
    <circle cx="340" cy="360" r="22" />
    <circle cx="400" cy="360" r="22" />

    <!-- Outriggers -->
    <path d="M80 310 L60 310 L60 380 M40 380 L80 380" />
    <path d="M440 310 L460 310 L460 380 M440 380 L480 380" />

    <!-- Telescopic Boom -->
    <path d="M350 280 L150 120 L180 100 L400 250" />
    <!-- Boom Sections -->
    <line x1="200" y1="160" x2="215" y2="148" />
    <line x1="250" y1="200" x2="265" y2="188" />
    <line x1="300" y1="240" x2="315" y2="228" />

    <!-- Winch/Cable Lines -->
    <line x1="150" y1="120" x2="150" y2="220" stroke-width="3"/>
  </g>

  <!-- Accents (Green Neon) -->
  <g stroke="#10b981" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-green)">
    <!-- Cabin -->
    <path d="M320 280 L320 200 L390 200 L400 280" />
    <path d="M340 220 L370 220 L375 260 L340 260 Z" /> <!-- Window -->
    
    <!-- Hook Block -->
    <path d="M130 220 H170 V260 H130 Z" />
    <path d="M150 260 V280" />
    <path d="M150 280 Q130 310 150 320" stroke-width="5"/> <!-- Hook -->

    <!-- Outrigger Pads Highlight -->
    <line x1="40" y1="380" x2="80" y2="380" stroke="#10b981" stroke-width="4" />
    <line x1="440" y1="380" x2="480" y2="380" stroke="#10b981" stroke-width="4" />
    
    <!-- Counterweight -->
    <rect x="400" y="220" width="40" height="40" />
  </g>

  <!-- Text -->
  <text x="256" y="460" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#fef08a" filter="url(#glow-amber)" letter-spacing="2">SC USER</text>
</svg>
